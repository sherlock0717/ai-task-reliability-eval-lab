[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "creative-agent-eval"
version = "0.1.0"
description = "DeepSeek V4 creative Agent loop reliability evaluation scaffold"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
creative-agent-eval = "creative_agent_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
