name: Run DeepSeek API smoke

on:
  workflow_dispatch:
    inputs:
      case_id:
        description: Single pilot case ID
        required: true
        default: B04
        type: string
      model:
        description: DeepSeek model
        required: true
        default: deepseek-v4-flash
        type: choice
        options:
          - deepseek-v4-flash
          - deepseek-v4-pro
      thinking:
        description: Thinking mode
        required: true
        default: enabled
        type: choice
        options:
          - enabled
          - disabled
      reasoning_effort:
        description: Reasoning effort
        required: true
        default: high
        type: choice
        options:
          - high
          - max
      seed:
        description: Recorded seed
        required: true
        default: '0'
        type: string

permissions:
  contents: read

concurrency:
  group: deepseek-api-smoke
  cancel-in-progress: false

jobs:
  run-one-case:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: deepseek-eval
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      CASE_ID: ${{ inputs.case_id }}
      MODEL: ${{ inputs.model }}
      THINKING: ${{ inputs.thinking }}
      REASONING_EFFORT: ${{ inputs.reasoning_effort }}
      SEED: ${{ inputs.seed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Check secret
        shell: bash
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "DEEPSEEK_API_KEY is not configured in the deepseek-eval environment."
            exit 1
          fi
      - name: Validate registry
        run: creative-agent-eval validate-registry
      - name: Run one API case
        shell: bash
        run: |
          mkdir -p outputs/api_smoke
          creative-agent-eval run-api \
            --case-id "$CASE_ID" \
            --model "$MODEL" \
            --thinking "$THINKING" \
            --reasoning-effort "$REASONING_EFFORT" \
            --seed "$SEED" \
            --out "outputs/api_smoke/${CASE_ID}.json"
      - name: Upload trace
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-api-smoke-${{ github.run_id }}
          path: outputs/api_smoke/*.json
          if-no-files-found: error
          retention-days: 30
